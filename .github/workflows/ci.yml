name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Type-check and build frontend
        run: npm run build
        working-directory: frontend
      - name: Test and package backend with frontend assets
        run: mvn -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: primer-app
          path: backend/target/primer-api-0.1.0.jar
