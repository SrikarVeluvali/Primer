spring:
  application:
    name: primer
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/primer}
    username: ${DATABASE_USERNAME:primer}
    password: ${DATABASE_PASSWORD:primer}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

primer:
  storage:
    root: ${PAPER_STORAGE_ROOT:./data/papers}
  pdf-extraction:
    max-source-size: 50MB
    max-pages: 100
    render-dpi: 150
    max-rendered-pages: 20
    max-total-image-size: 50MB
