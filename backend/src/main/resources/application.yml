server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SECURE_COOKIES:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/folio;AUTO_SERVER=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
folio:
  data-directory: ${DATA_DIRECTORY:./data/papers}
  ollama-url: ${OLLAMA_URL:http://localhost:11434}
  chat-model: ${CHAT_MODEL:phi4-mini:latest}
  embedding-model: ${EMBEDDING_MODEL:nomic-embed-text}
primer:
  search-api-key: ${BRAVE_SEARCH_API_KEY:}
